name: Signaler un bug
description: Un problème avec l'application Elymon pour Android (installation, mise à jour, lancement, contrôles).
title: "[Bug] <résumé en quelques mots>"
labels: [bug]
body:
- type: markdown
  attributes:
    value: |
      Merci de prendre le temps de signaler un problème.
      Cette page concerne **l'application Elymon pour Android** (le lanceur). Pour un souci en jeu
      sur le serveur (grades, boutique, Pokémon perdus…), passe plutôt par le support Elythera sur
      [elythera.com](https://elythera.com).

- type: textarea
  id: description
  attributes:
    label: Ce qui se passe
    description: Décris le problème en quelques phrases, et le message affiché s'il y en a un.
    placeholder: "Exemple : après « Mise à jour d'Elymon », l'écran reste noir et le jeu se ferme."
  validations:
    required: true

- type: textarea
  id: steps
  attributes:
    label: Comment le reproduire
    placeholder: |
      1. Ouvrir Elymon
      2. Appuyer sur Jouer
      3. …
  validations:
    required: true

- type: textarea
  id: expected
  attributes:
    label: Ce que tu attendais
  validations:
    required: true

- type: textarea
  id: logs
  attributes:
    label: Journaux
    description: |
      Dans l'application, utilise « Envoyer les journaux », puis joins ici l'archive
      `elymon-journaux-….zip`. Les jetons de connexion et la clé Elythera en sont retirés
      automatiquement ; ne colle jamais ici un fichier de `Android/data` à la main.
      Tu peux aussi ajouter des captures d'écran ou une vidéo.
  validations:
    required: true

- type: textarea
  id: device
  attributes:
    label: Appareil
    description: Le fichier `infos.txt` de l'archive contient déjà tout cela ; remplis ce qui manque.
    value: |
      - Modèle du téléphone :
      - Version d'Android :
      - Version d'Elymon (infos.txt, ou Réglages Android → Applications → Elymon) :
    render: markdown
  validations:
    required: true

- type: textarea
  id: more
  attributes:
    label: Autre chose ?
  validations:
    required: false
