# Version of the Elymon Android app, read by app_pojavlauncher/build.gradle.
#
# versionCode must increase with every APK that leaves the team: Android refuses
# to update an app to a lower versionCode. It is also announced to ElytheraMod
# as "<ElymonConfig.ELP_LEVEL>-android.<versionCode>".
# versionName is what the player sees and what the distribution's
# requires.android is compared with (the "-alpha.1" qualifier is ignored there).
elymon.versionCode=1
elymon.versionName=1.0.0-alpha.1
# Optionnel : les builds plus anciens refusent de jouer et proposent la mise à jour
# (voir docs/elymon/RELEASE.md). Jamais supérieur à elymon.versionCode.
# elymon.minVersionCode=1
